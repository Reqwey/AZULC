[package]
name = "azulc"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Azusa Minecraft Launcher — a next-generation lightweight, high-performance Minecraft launcher and technology validation platform"

[dependencies]
chrono = "0.4"
directories = "6.0"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
open = "5"
quick-xml = { version = "0.42", features = ["serialize"] }
reqwest = { version = "0.13", features = ["form", "json", "stream"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha1 = "0.10"
sha2 = "0.10"
shlex = "1"
sysinfo = "=0.38.4"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0"

[profile.release]
lto = "thin"
strip = true
